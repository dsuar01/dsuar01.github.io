<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 Not Found · Darien Suarez Perez</title>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Sora:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0d1b2a;
        color: #ede9f6;
        font-family: 'Sora', system-ui, sans-serif;
      }
      main { padding: 24px; }
      .request { font-family: 'JetBrains Mono', monospace; color: #8fa3bf; }
      .method { color: #ff8a3d; font-weight: 700; margin-right: 8px; }
      .status { color: #ff6b6b; margin-left: 12px; }
      h1 { font-size: 2rem; margin: 16px 0 24px; }
      a {
        display: inline-block;
        padding: 10px 20px;
        border-radius: 8px;
        background: #ff8a3d;
        color: #0d1b2a;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="request">
        <span class="method">GET</span><span id="path"></span>
        <span class="status">404 Not Found</span>
      </p>
      <h1>That route doesn't exist.</h1>
      <a href="/">Back to home</a>
    </main>
    <script>
      document.getElementById('path').textContent = window.location.pathname
    </script>
  </body>
</html>
